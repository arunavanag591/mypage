<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <!--[if lt IE 9]>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5shiv/3.7.3/html5shiv.min.js"></script>
    <![endif]-->
    {% include head-custom.html %}
  </head>
  <body class="{{ page.body_class | default: 'page-standard' }}">
    <div class="page-backdrop"></div>
    <div class="site-shell">
      <aside class="site-sidebar">
        <a class="brand-lockup" href="{{ "/" | absolute_url }}">
          <h1>{{ site.title | default: site.github.repository_name }}</h1>
        </a>

        {% if site.logo %}
          <img class="profile-photo" src="{{site.logo | relative_url}}" alt="{{ site.title }} profile photo" />
        {% endif %}

        <div class="sidebar-icons">
          <a href="mailto:arunavan@uchicago.edu" aria-label="Email">
            <i class="fas fa-envelope"></i>
          </a>
          <a href="https://github.com/arunavanag591" target="_blank" rel="noreferrer" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a href="https://linkedin.com/in/arunavanag/" target="_blank" rel="noreferrer" aria-label="LinkedIn">
            <i class="fab fa-linkedin"></i>
          </a>
          <a href="https://scholar.google.com/citations?user=veJS5XcAAAAJ" target="_blank" rel="noreferrer" aria-label="Google Scholar">
            <i class="ai ai-google-scholar"></i>
          </a>
        </div>

        <p class="sidebar-summary">{{ site.description | default: site.github.project_tagline }}</p>

        <div class="sidebar-badges">
          <span>CODEX</span>
          <span>Spatial Omics</span>
          <span>Immune Microenvironment</span>
        </div>

        <nav class="site-nav" aria-label="Primary">
          <a href="{{ "/" | absolute_url }}">Home</a>
          <a href="{{ site.baseurl }}/publications/">Publications</a>
          <a href="{{ site.baseurl }}/resume/">CV</a>
        </nav>
      </aside>

      <main class="site-main">
        {{ content }}
      </main>
    </div>
    <script src="{{ "/assets/js/scale.fix.js" | relative_url }}"></script>
    <script>
      document.querySelectorAll("[data-reveal]").forEach(function (element) {
        element.classList.add("reveal-ready");
      });

      if ("IntersectionObserver" in window) {
        var revealObserver = new IntersectionObserver(function (entries) {
          entries.forEach(function (entry) {
            if (entry.isIntersecting) {
              entry.target.classList.add("is-visible");
              revealObserver.unobserve(entry.target);
            }
          });
        }, { threshold: 0.12 });

        document.querySelectorAll("[data-reveal]").forEach(function (element) {
          revealObserver.observe(element);
        });
      } else {
        document.querySelectorAll("[data-reveal]").forEach(function (element) {
          element.classList.add("is-visible");
        });
      }
    </script>
  </body>
</html>
